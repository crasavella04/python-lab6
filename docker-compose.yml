services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    image: lab6-app
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks
    # сначала миграции, затем сервер; exec делает uvicorn PID 1, чтобы он получал SIGTERM
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks_test
    depends_on:
      db:
        condition: service_healthy
    profiles: [test]

volumes:
  pgdata:
